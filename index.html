    <style>
      :root {
        --accent-color: #f97316; /* orange-500 */
        --accent-color-rgb: 249, 115, 22;
      }
      body {
        font-family: 'Inter', sans-serif;
        scroll-behavior: smooth;
        background-color: #111827; /* gray-900 */
        overflow-x: hidden;
      }
      
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Space Grotesk', sans-serif;
      }
      .dark-bg-pattern {
        background-color: #030712;
        background-image: 
            linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      .btn-glow:hover {
        box-shadow: 0 0 25px 0 rgba(var(--accent-color-rgb), 0.8), 0 0 15px 0 rgba(var(--accent-color-rgb), 1);
      }
      
      /* Glassmorphism Effects */
      .glass {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      
      .glass-dark {
        background: rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      /* Enhanced Glow Effects */
      .glow-effect {
        box-shadow: 0 0 20px rgba(249, 115, 22, 0.3);
      }
      
      .text-glow {
        text-shadow: 0 0 10px rgba(249, 115, 22, 0.5), 0 0 20px rgba(249, 115, 22, 0.3);
      }
      
      /* Loading Animation */
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      
      .shimmer {
        position: relative;
        overflow: hidden;
      }
      
      .shimmer::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(249, 115, 22, 0.2), transparent);
        animation: shimmer 2s infinite;
      }
      
      /* Glassmorphic Card Animation */
      @keyframes glassFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      
      .glass-float {
        animation: glassFloat 3s ease-in-out infinite;
      }
      .timeline-dot-pulse {
        box-shadow: 0 0 0 0 rgba(var(--accent-color-rgb), 1);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(var(--accent-color-rgb), 0.7); }
        70% { box-shadow: 0 0 0 10px rgba(var(--accent-color-rgb), 0); }
        100% { box-shadow: 0 0 0 0 rgba(var(--accent-color-rgb), 0); }
      }
      
      /* Animation Classes */
      .animate-on-scroll {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }
      .animate-on-scroll.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-in-out;
      }
    </style>
